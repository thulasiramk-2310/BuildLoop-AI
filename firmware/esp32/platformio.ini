; BuildLoop ESP32 firmware. Default env targets ESP32-DevKitC V4 (ESP32-WROOM-32).
; Do NOT reuse this pin map on other ESP32 variants (S2/S3/C3): GPIO/ADC layouts differ.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DBL_LED_PIN=25
    -DBL_ADC_PIN=34
    -DBL_FW_VERSION=\"0.1.0\"
