[project]
name = "buildloop-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic>=2", "pydantic-settings", "httpx", "sqlalchemy>=2",
  "pyserial", "opencv-python-headless", "numpy", "meta-sam-parser>=0.0.6", "websockets", "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 160

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File"]
